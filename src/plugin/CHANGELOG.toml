# Megaphonk Mod Changelog
# Format:
# [version."X.Y.Z"]
# changes = [
#     "Change 1 description",
#     "Change 2 description",
# ]

[version."2.0.4"]
changes = [
    "Clients no longer push enemies around locally when they are hit: only the host knocks enemies back, so they no longer fly off to the side or into you.",
]

[version."2.0.3"]
changes = [
    "Enemies hit by another player are knocked back away from that player, not all in the same direction.",
    "Fixed an error when joining a room that hid the lobby info on the character selection.",
]

[version."2.0.2"]
changes = [
    "Enemies near you are synced like in 1.0.0 again: 40 updates a second, and when a packet is late they wait instead of guessing ahead. No more enemies jumping into you.",
    "Far enemies keep the low traffic of 2.0.0.",
]

[version."2.0.1"]
changes = [
    "Enemies near you move smoothly and where they really are again: they are sent every update and shown 0.1 s behind like in 1.0.0, no more jumps when a correction arrives.",
    "Strong knockback (Pinball, Shockwave) is no longer mistaken for a teleport.",
    "Far enemies keep the low traffic of 2.0.0, and blend smoothly when they come closer or a packet is lost.",
]

[version."2.0.0"]
changes = [
    "Much less network traffic with many enemies (several times less for 400 moving enemies): no more growing ping in big fights.",
    "Enemies are predicted from their position and velocity: the host only sends an enemy when it leaves its predicted path (turns, stops, knockback, hp change), and every enemy in full once a second. Far enemies are checked less often.",
    "Packed enemy format: position changes in 3 bytes when small, the hp only when it changes. The client confirms what it received, enemies of a lost packet are resent in full at once.",
    "Remote enemies move with no interpolation delay (they used to be shown 0.1 s late), small corrections are smoothed out.",
    "Network packets are compressed when that makes them smaller (damage and pickup bursts shrink 2-3x).",
    "Player inventories are only sent when they change (and every 2 seconds), not 60 times a second.",
    "Not compatible with 1.0.0: every player needs 2.0.0.",
]

[version."1.0.0"]
changes = [
    "First release of Megaphonk Mod, a co-op mod for Megabonk 1.0.69 based on Megabonk Together.",
    "Rooms through Steam, no server and no codes: the host presses Host, friends join from MEGAPHONK! -> Join. The host can also start a run alone.",
    "Netplay Options on the host's character selection: party rules and 14 run modifiers, with caps on the combined bonuses.",
    "Party pause while anyone picks a reward, F8 unlocks a stuck pause. A chest bought by one player opens for everyone, gold is per player.",
    "Downed state and revive (8 m, a downed player barely crawls and sways, timers stop during picks), pings, team meter, team stats at the end of a run.",
    "Co-op challenges: a chest on the next stage for each player with no death, and for each player who survived the stage boss fight.",
    "Network messages sent in one packet per frame, merged enemy damage, much less work per enemy, projectile and pickup: less stutter in long runs. Balanced enemy aggro across the party.",
    "The mod's texts follow the game's language: English and Russian.",
]
